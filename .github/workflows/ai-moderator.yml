name: AI Moderator

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]

jobs:
  spam-detection:
    if: github.repository == 'LostElkByte/vue3-mobile-table'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      models: read
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: AI moderation
        uses: github/ai-moderator@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          spam-label: spam
          ai-label: ai-generated
          minimize-detected-comments: true
          dry-run: true
          enable-spam-detection: true
          enable-link-spam-detection: true
          enable-ai-detection: true
          custom-prompt-path: .github/prompts/spam-custom.prompt.yml
